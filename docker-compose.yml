services:
  db:
    image: mariadb:10.6
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-changeme_root}
      MYSQL_DATABASE: ${DB_NAME:-maccms}
      MYSQL_USER: ${DB_USER:-maccms}
      MYSQL_PASSWORD: ${DB_PASSWORD:-changeme_db}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    volumes:
      - web_data:/var/www/html
    depends_on:
      db:
        condition: service_healthy

  nginx:
    build:
      context: .
      dockerfile: Dockerfile.nginx
    restart: always
    ports:
      - "8080:80"
    volumes:
      - web_data:/var/www/html
    depends_on:
      - web

volumes:
  db_data:
  web_data:
